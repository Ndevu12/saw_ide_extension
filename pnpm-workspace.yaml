# A supply-chain scanner's own build is a target. These settings keep a compromised dev
# dependency from running on install, or from arriving the day it is published.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Minutes. Releases older than this predate many packages adopting provenance; a takeover arrives
# as a new release, which this still checks.
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
strictDepBuilds: true
overrides:
  # @vscode/test-cli still requires mocha 11, which pins releases with known advisories.
  mocha>diff: ^8.0.3
  mocha>serialize-javascript: ^7.1.2
allowBuilds:
  # Only verifies marketplace signatures on install; packaging and publishing do not use it.
  '@vscode/vsce-sign': false
  esbuild: true
