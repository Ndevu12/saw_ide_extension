name: release

# A `v*` tag packages the extension once, publishes that same file to the Visual Studio Marketplace
# (VS Code) and Open VSX (Cursor, Antigravity, Devin Desktop, VSCodium), and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main; release only from main."; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" || { echo "::error::$GITHUB_REF_NAME does not match the version in package.json."; exit 1; }
      - name: CHANGELOG.md has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section."; exit 1; }
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: saw.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    env:
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
      HAS_VSCE: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - name: At least one registry token is set
        if: env.HAS_OVSX != 'true' && env.HAS_VSCE != 'true'
        run: |
          echo "::error::Neither OVSX_PAT nor VSCE_PAT is set in the release environment, so nothing would be published."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to Open VSX
        if: env.HAS_OVSX == 'true'
        run: pnpm exec ovsx publish saw.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Publish to the Visual Studio Marketplace
        if: env.HAS_VSCE == 'true'
        run: pnpm exec vsce publish --packagePath saw.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Create the GitHub Release with the published package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="saw-${GITHUB_REF_NAME#v}.vsix"
          mv saw.vsix "$asset"
          sha256sum "$asset" > "$asset.sha256"
          # A release made by hand gets the files rather than a second release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" "$asset.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
