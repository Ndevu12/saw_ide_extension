name: remote-server

# Runs saw.vsix in the VS Code server, the program Remote - SSH, WSL and Dev Containers start on the
# remote machine, in a Debian container with a headless browser as the window: saw must be installed
# and run on the server, and a server without network must never show a folder as clean. Online
# (Docker Hub, Debian, PyPI, the VS Code update server), so it runs when the paths involved change,
# weekly, and on demand, not on every pull request.
on:
  pull_request:
    paths:
      - "src/extension.ts"
      - "src/editor/engine.ts"
      - "src/editor/installer.ts"
      - "src/editor/reports.ts"
      - "src/core/install.ts"
      - "src/core/locate.ts"
      - "test/remote/**"
      - "package.json"
      - ".github/workflows/remote-server.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.96.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:remote
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
