name: remote-install-images

on:
  pull_request:
    paths:
      - "src/core/install.ts"
      - "src/core/python.ts"
      - "src/core/locate.ts"
      - "src/core/diagnose.ts"
      - "src/core/run.ts"
      - "test/remote/install-images/**"
      - "test/remote/scenarios.mjs"
      - "package.json"
      - ".github/workflows/remote-install-images.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-install-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:remote:install-images
