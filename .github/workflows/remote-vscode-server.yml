name: remote-vscode-server

on:
  pull_request:
    paths:
      - "src/extension.ts"
      - "src/editor/actions.ts"
      - "src/editor/alerts.ts"
      - "src/editor/engine.ts"
      - "src/editor/installer.ts"
      - "src/editor/reports.ts"
      - "src/core/install.ts"
      - "src/core/locate.ts"
      - "test/remote/vscode-server/**"
      - "test/remote/scenarios.mjs"
      - "package.json"
      - ".github/workflows/remote-vscode-server.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-vscode-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.96.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:remote:vscode-server
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          SAW_REMOTE_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-server-${{ matrix.vscode }}-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
