name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The release the extension installs (package.json "saw") is the one the contract tests run against.
      - name: Install saw
        shell: bash
        run: python -m pip install "stayawakebot==$(node -p 'require("./package.json").saw.saw')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-types
      - run: pnpm run lint
      - name: Unit and contract tests
        run: pnpm test
        env:
          SAW_CONTRACT_REQUIRED: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      - name: The installer installs pipx, then saw, from PyPI
        run: pnpm exec vitest run test/unit/real-install.test.ts
        env:
          SAW_INSTALL_E2E: "1"
          SAW_E2E_NO_PIPX: "1"
      - name: Integration tests (oldest supported VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
      - name: Integration tests (current VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
        env:
          VSCODE_TEST_VERSION: stable
      - name: Integration tests (no saw on the machine; the extension installs it)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
        env:
          SAW_IT_INSTALL: "1"
      - name: Package
        if: runner.os == 'Linux'
        run: pnpm run package
      - name: This repository scans clean with saw
        if: runner.os == 'Linux'
        run: saw scan .
